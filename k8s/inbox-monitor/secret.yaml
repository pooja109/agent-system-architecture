apiVersion: v1
kind: Secret
metadata:
  name: inbox-monitor-secrets
  namespace: email-agents
  labels:
    app: inbox-monitor
    component: secrets
type: Opaque
stringData:
  # Azure Key Vault Configuration
  AZURE_KEY_VAULT_URL: "https://your-keyvault.vault.azure.net/"
  AZURE_TENANT_ID: "your-tenant-id"
  AZURE_CLIENT_ID: "your-client-id"
  AZURE_CLIENT_SECRET: "your-client-secret"
  
  # Graph API Configuration
  GRAPH_API_MONITORED_EMAIL: "monitored-inbox@example.com"
  
  # Databricks Configuration
  DATABRICKS_SERVER_HOSTNAME: "adb-xxxxx.azuredatabricks.net"
  DATABRICKS_HTTP_PATH: "/sql/1.0/warehouses/xxxxx"
  DATABRICKS_CATALOG: "your_catalog"
  DATABRICKS_SCHEMA: "your_schema"
  DATABRICKS_TABLE_SUFFIX: ""
  
  # Test Mode Configuration (set to empty in production)
  TEST_EMAIL_SENDER: ""
  TEST_SALESFORCE_EMAIL: ""
  
  # Scenario Configuration
  SCENARIO_VICTORIA_GRANT_EMAIL: ""
  SCENARIO_ACCOUNT_TEAM_EMAIL: ""