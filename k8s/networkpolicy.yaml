apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: email-agents-netpol
  namespace: email-agents
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress from pods within the same namespace
  - from:
    - namespaceSelector:
        matchLabels:
          name: email-agents
  # Allow health check probes from kube-system
  - from:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8081
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow HTTPS to Azure services
  - to: []
    ports:
    - protocol: TCP
      port: 443
  # Allow HTTP for health checks and internal communication
  - to:
    - namespaceSelector:
        matchLabels:
          name: email-agents
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8081
  # Allow Databricks communication
  - to: []
    ports:
    - protocol: TCP
      port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inbox-monitor-specific
  namespace: email-agents
spec:
  podSelector:
    matchLabels:
      app: inbox-monitor
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow health checks on port 8080
  - ports:
    - protocol: TCP
      port: 8080
  egress:
  # Allow all egress for external API calls
  - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: email-agent-specific
  namespace: email-agents
spec:
  podSelector:
    matchLabels:
      app: email-agent
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow health checks on port 8081
  - ports:
    - protocol: TCP
      port: 8081
  egress:
  # Allow all egress for external API calls and blob storage
  - {}