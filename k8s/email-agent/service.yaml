apiVersion: v1
kind: Service
metadata:
  name: email-agent
  namespace: email-agents
  labels:
    app: email-agent
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: email-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: email-agent
  namespace: email-agents
  labels:
    app: email-agent