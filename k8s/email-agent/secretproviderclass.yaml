apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: email-agent-keyvault-secrets
  namespace: email-agents
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: ""
    keyvaultName: "aou-lowtouch-kv"
    tenantId: "replace-with-tenant-id"
    objects: |
      array:
        - |
          objectName: azure-key-vault-url
          objectType: secret
          objectVersion: ""
        - |
          objectName: azure-tenant-id
          objectType: secret
          objectVersion: ""
        - |
          objectName: azure-client-id
          objectType: secret
          objectVersion: ""
        - |
          objectName: azure-client-secret
          objectType: secret
          objectVersion: ""
        - |
          objectName: azure-storage-connection-string
          objectType: secret
          objectVersion: ""
        - |
          objectName: azure-storage-account-name
          objectType: secret
          objectVersion: ""
        - |
          objectName: azure-storage-sas-token
          objectType: secret
          objectVersion: ""
        - |
          objectName: databricks-server-hostname
          objectType: secret
          objectVersion: ""
        - |
          objectName: databricks-http-path
          objectType: secret
          objectVersion: ""
        - |
          objectName: databricks-catalog
          objectType: secret
          objectVersion: ""
        - |
          objectName: databricks-schema
          objectType: secret
          objectVersion: ""
  secretObjects:
  - secretName: email-agent-keyvault-secrets
    type: Opaque
    data:
    - objectName: azure-key-vault-url
      key: AZURE_KEY_VAULT_URL
    - objectName: azure-tenant-id
      key: AZURE_TENANT_ID
    - objectName: azure-client-id
      key: AZURE_CLIENT_ID
    - objectName: azure-client-secret
      key: AZURE_CLIENT_SECRET
    - objectName: azure-storage-connection-string
      key: AZURE_STORAGE_CONNECTION_STRING
    - objectName: azure-storage-account-name
      key: AZURE_STORAGE_ACCOUNT_NAME
    - objectName: azure-storage-sas-token
      key: AZURE_STORAGE_SAS_TOKEN
    - objectName: databricks-server-hostname
      key: DATABRICKS_SERVER_HOSTNAME
    - objectName: databricks-http-path
      key: DATABRICKS_HTTP_PATH
    - objectName: databricks-catalog
      key: DATABRICKS_CATALOG
    - objectName: databricks-schema
      key: DATABRICKS_SCHEMA