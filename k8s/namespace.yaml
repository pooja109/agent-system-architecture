apiVersion: v1
kind: Namespace
metadata:
  name: email-agents
  labels:
    name: email-agents
    environment: production
    managed-by: kubectl
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: email-agents-staging
  labels:
    name: email-agents-staging
    environment: staging
    managed-by: kubectl
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted