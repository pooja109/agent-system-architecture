agent_config:
  name: "test-agent"
  description: "Test agent for unit testing"
  version: "1.0.0"
  author: "Test Suite"

system_instructions: |
  You are a test AI agent for unit testing purposes.

  INTENT CATEGORIES TO CLASSIFY:
  1. TEST_POSITIVE - Test positive intent
  2. TEST_NEGATIVE - Test negative intent

  CONFIDENCE SCORING GUIDELINES:
  - High confidence (0.85-0.99): Clear test intent
  - Medium confidence (0.60-0.84): Some test ambiguity

  RESPONSE FORMAT:
  Always respond with valid JSON for testing.

confidence_scoring:
  high:
    range: [0.85, 0.99]
    description: "Clear test intent"
  medium:
    range: [0.60, 0.84]
    description: "Some test ambiguity"
  low:
    range: [0.30, 0.59]
    description: "Unclear test intent"
  very_low:
    range: [0.10, 0.29]
    description: "Very ambiguous test"

response_format:
  type: "json"
  response_schema:
    intent: "string"
    confidence: "float"