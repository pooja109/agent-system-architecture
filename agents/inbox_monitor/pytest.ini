[pytest]
minversion = 6.0
addopts = -ra -q --tb=short --import-mode=importlib --durations=10 --durations-min=1.0
testpaths = tests tests/unit
pythonpath = . ../..
norecursedirs = config services models utils monitoring docs archive
python_files = test_*.py *_test.py
python_classes = Test* !TestModeSettings
python_functions = test_*
asyncio_mode = auto
# Custom markers for test categorization
markers =
    fast: Tests that complete in under 5 seconds - suitable for rapid development feedback
    medium: Tests that complete in 5-30 seconds - full functionality with reasonable time
    slow: Tests that take over 30 seconds - retry exhaustion, timeout scenarios, resource intensive
    integration: Tests that verify service integrations with mocked external dependencies
    unit: Pure unit tests with no external service dependencies or I/O operations
    edge_case: Tests that verify error conditions, boundary values, and exceptional scenarios
    azure: Tests that interact with Azure services (AI Foundry, Graph API, Key Vault)
    email: Tests focused on email processing, parsing, and transformation functionality  
    retry: Tests that verify retry logic, failure recovery, and timeout handling
    performance: Tests that validate system performance characteristics and resource usage
    smoke: Critical path tests for basic functionality validation - subset of fast tests
    ci_safe: Tests suitable for automated CI/CD environments - excludes resource-intensive tests
    salesforce: Tests that interact with Salesforce services and APIs
    databricks: Tests that interact with Databricks services and connection pools
    prompt: Tests that verify prompt management and template rendering functionality
    monitoring: Tests that verify system monitoring, health checks, and metrics collection
    database: Tests that interact with database services and data persistence
    e2e: End-to-end tests that verify complete system workflows
    load: Load testing with high volume, concurrency, and burst patterns - requires extended timeouts
    security: Security compliance tests including PII handling, access controls, and encryption
    production: Production readiness validation tests for deployment verification
    benchmark: Performance benchmark tests for measuring system capabilities and limits
    scenario_tracking: Tests specific to scenario tracking functionality and data storage
    real_database: Tests that connect to real database instances for integration validation
    cli: Tests focused on command-line interface functionality
    timeout: Tests with execution time limits
    expected_duration: Performance expectation tracking
    error_scenarios: Tests that verify error handling and recovery mechanisms
    load_testing: Load testing markers for high-volume testing scenarios
    
    # Resource markers
    memory_intensive: marks tests that use significant memory
    io_intensive: marks tests that use significant I/O
    cpu_intensive: marks tests that use significant CPU
    
    # Execution markers
    no_timeout: marks tests that should not have timeout applied
    requires_cleanup: marks tests that require special cleanup
    performance_test: marks tests that measure performance

# Performance and timeout settings
timeout = 300
timeout_method = thread
timeout_func_only = true

# Output configuration
console_output_style = progress
log_cli = false
log_cli_level = WARNING

# Test discovery optimization
collect_ignore = build dist .git .tox __pycache__

# Filter warnings for performance
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestCollectionWarning
    ignore::pytest.PytestUnraisableExceptionWarning

# Parallel execution support
# Use: pytest -n auto for parallel execution of fast tests
# Use: pytest -m "not slow" -n 4 for parallel medium tests