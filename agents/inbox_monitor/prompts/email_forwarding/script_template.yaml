template_version: "1.0.0"
template: |
  import sys
  import os
  sys.path.insert(0, r"${email_agent_path}")

  # Ensure the subprocess can find the .env file in the root directory
  from dotenv import load_dotenv
  root_env_path = os.path.join(r"${email_agent_path}", "..", "..", ".env")
  load_dotenv(root_env_path)

  from email_clients.azure_email_client import AzureEmailClient
  from services.test_mode_service import TestModeService
  from config.settings import get_settings
  from database.models import EmailContent
  import asyncio
  import json

  async def send_email():
      try:
          settings = await get_settings()
          azure_client = AzureEmailClient(settings.azure_communication)
          test_mode_service = TestModeService(settings)
          
          # Create email content object
          email_content = EmailContent(
              subject="${escaped_subject}",
              body_html="""${escaped_body_html}""",
              recipient_email="${recipient_email}",
              customer_id="${customer_id}",
              customer_name="${customer_name}",
              contact_name="${contact_name}"
          )
          
          # Apply test mode override if enabled
          processed_content = test_mode_service.process_email_content(email_content)
          
          result = await azure_client.send_email(
              recipient_email=processed_content.recipient_email,
              subject=processed_content.subject,
              body_html=f"<html><body>{processed_content.body_html}</body></html>"
          )
          
          print(json.dumps({"success": result.success, "message_id": result.message_id or "", "error": result.error_message or ""}))
      except Exception as e:
          print(json.dumps({"success": False, "error": str(e)}))

  if __name__ == "__main__":
      asyncio.run(send_email())

variables:
  email_agent_path:
    name: "email_agent_path"
    description: "Path to the email agent directory"
    type: "string"
    required: true
  escaped_subject:
    name: "escaped_subject"
    description: "Email subject with proper escaping for Python string"
    type: "string"
    required: true
  escaped_body_html:
    name: "escaped_body_html"
    description: "Email body HTML with proper escaping for Python triple quotes"
    type: "string"
    required: true
  recipient_email:
    name: "recipient_email"
    description: "Email address to send to"
    type: "string"
    required: true
  customer_id:
    name: "customer_id"
    description: "Customer identifier for tracking"
    type: "string"
    required: true
  customer_name:
    name: "customer_name"
    description: "Customer display name"
    type: "string"
    required: true
  contact_name:
    name: "contact_name"
    description: "Contact display name"
    type: "string"
    required: true

